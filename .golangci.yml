version: "2"

run:
  go: "1.25"

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

linters:
  default: none

  enable:
    - bodyclose
    - copyloopvar
    - dogsled
    - dupl
    - errname
    - errcheck
    - errorlint
    - gocheckcompilerdirectives
    - goconst
    - gocritic
    - gocyclo
    - prealloc
    - godox
    - goprintffuncname
    - govet
    - ineffassign
    - intrange
    - misspell
    - nakedret
    - noctx
    - nolintlint
    - revive
    - staticcheck
    - testifylint
    - unconvert
    - unused
    - whitespace

formatters:
  enable:
    - gofumpt
    - goimports
